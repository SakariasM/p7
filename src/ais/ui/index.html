<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIS Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e2e1dc; --accent: #1f5fbf; --accent-text: #ffffff; --hover: #f0efeb;
    --error: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 340px 1fr;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px;
  }
  #map { height: 100%; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, button { font: inherit; }
  input, select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--text);
  }
  .row { display: flex; gap: 8px; align-items: end; }
  .row > * { flex: 1; }
  button {
    padding: 7px 12px; border: 1px solid var(--accent); border-radius: 6px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: progress; }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
  .status.error { color: var(--error); }
  ul.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 6px; max-height: 260px; overflow-y: auto; }
  ul.list:empty { display: none; }
  ul.list li { padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  ul.list li:last-child { border-bottom: 0; }
  ul.list li:hover, ul.list li.active { background: var(--hover); }
  .meta { color: var(--muted); font-size: 12px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 10px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .leaflet-popup-content { font: 13px/1.45 system-ui, sans-serif; }
  .leaflet-popup-content button { margin-top: 6px; padding: 4px 10px; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    #map { height: 60vh; }
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>AIS Explorer</h1>
    <div class="sub">P7 prototype · Danish waters, Oct 2025 – Sep 2026 · all times UTC</div>
  </div>

  <section>
    <h2>Ships at a moment</h2>
    <div class="row">
      <div><label for="at">Time</label><input id="at" type="datetime-local" value="2026-01-20T12:00" min="2025-10-01T00:00" max="2026-09-30T23:59"></div>
      <div style="flex:0 0 90px"><label for="lookback">Seen within</label>
        <select id="lookback"><option value="5">5 min</option><option value="10" selected>10 min</option><option value="30">30 min</option><option value="60">60 min</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:8px"><button id="snap">Show ships in view</button></div>
    <div id="snap-status" class="status"></div>
    <div id="legend" class="legend"></div>
  </section>

  <section>
    <h2>Find a vessel</h2>
    <input id="q" placeholder="Name, callsign or MMSI" autocomplete="off">
    <div id="search-status" class="status"></div>
    <ul id="results" class="list"></ul>
  </section>

  <section id="vessel-panel" hidden>
    <h2>Vessel</h2>
    <dl id="vessel"></dl>
    <div class="row">
      <button id="track-btn" class="ghost">24 h track around time</button>
      <button id="clear-btn" class="ghost" style="flex:0 0 70px">Clear</button>
    </div>
    <div id="vessel-status" class="status"></div>
    <h2 style="margin-top:12px">Trips (±15 days)</h2>
    <ul id="trips" class="list"></ul>
  </section>
</aside>
<div id="map"></div>

<script>
const COLORS = {
  Cargo: "#1f5fbf", Tanker: "#c2410c", Passenger: "#7c3aed", Fishing: "#15803d",
  Pleasure: "#db2777", Sailing: "#0e9fae", Tug: "#a16207",
};
const OTHER = "#8a8a84";
const colorFor = t => COLORS[t] || OTHER;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => ts ? ts.replace("T", " ").slice(0, 16) : "–";
const iso = d => d.toISOString().slice(0, 19);

async function api(path, params = {}) {
  const url = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = body.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : r.statusText);
  }
  return body;
}

function setStatus(id, text, error = false) {
  $(id).textContent = text;
  $(id).classList.toggle("error", error);
}

// Map
const map = L.map("map", { preferCanvas: true }).setView([56.0, 11.0], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 18, attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
}).addTo(map);
const shipsLayer = L.layerGroup().addTo(map);
const pathLayer = L.layerGroup().addTo(map);

$("legend").innerHTML = [...Object.entries(COLORS), ["Other", OTHER]]
  .map(([k, c]) => `<span><i class="dot" style="background:${c}"></i>${k}</span>`).join("");

function atValue() {
  const v = $("at").value;
  return v.length === 16 ? v + ":00" : v;
}

// Snapshot
async function loadSnapshot() {
  const b = map.getBounds();
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const bbox = [clamp(b.getWest(), -180, 180), clamp(b.getSouth(), -90, 90),
                clamp(b.getEast(), -180, 180), clamp(b.getNorth(), -90, 90)].map(x => x.toFixed(4)).join(",");
  $("snap").disabled = true;
  setStatus("snap-status", "Loading…");
  const t0 = performance.now();
  try {
    const s = await api("/snapshot", { at: atValue(), lookback_min: $("lookback").value, bbox });
    shipsLayer.clearLayers();
    for (const it of s.items) {
      L.circleMarker([it.lat, it.lon], {
        radius: 4, weight: 1, color: "#ffffff", fillColor: colorFor(it.ship_type), fillOpacity: .9,
      }).bindPopup(() => `
        <b>${esc(it.name || "Unknown name")}</b><br>
        ${esc(it.ship_type || "Unknown type")} · MMSI ${it.mmsi}<br>
        ${it.sog != null ? it.sog.toFixed(1) + " kn" : "speed –"} · seen ${fmt(it.ts)}<br>
        <button onclick="selectVessel(${it.mmsi})">Details &amp; trips</button>`)
        .addTo(shipsLayer);
    }
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    setStatus("snap-status", `${s.items.length.toLocaleString()} ships${s.truncated ? " (capped at 5,000; zoom in)" : ""} · ${secs}s`);
  } catch (e) {
    setStatus("snap-status", e.message, true);
  } finally {
    $("snap").disabled = false;
  }
}
$("snap").onclick = loadSnapshot;

// Search
let searchTimer;
$("q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("q").value.trim();
  if (!q) { $("results").innerHTML = ""; setStatus("search-status", ""); return; }
  searchTimer = setTimeout(async () => {
    try {
      const vs = await api("/vessels", { q, limit: 15 });
      setStatus("search-status", vs.length ? "" : "No matches");
      $("results").innerHTML = vs.map(v => `
        <li data-mmsi="${v.mmsi}"><b>${esc(v.name || "Unknown name")}</b>
        <div class="meta">${esc(v.ship_type || "–")} · ${v.mmsi}${v.callsign ? " · " + esc(v.callsign) : ""}</div></li>`).join("");
    } catch (e) { setStatus("search-status", e.message, true); }
  }, 250);
});
$("results").addEventListener("click", e => {
  const li = e.target.closest("li");
  if (li) selectVessel(Number(li.dataset.mmsi));
});

// Vessel, trips, track
let current = null;

async function selectVessel(mmsi) {
  current = mmsi;
  map.closePopup();
  $("vessel-panel").hidden = false;
  $("vessel").innerHTML = "";
  $("trips").innerHTML = "";
  setStatus("vessel-status", "Loading…");
  try {
    const v = await api(`/vessels/${mmsi}`);
    const dims = v.length ? `${v.length} × ${v.width ?? "?"} m` : "–";
    $("vessel").innerHTML = `
      <dt>Name</dt><dd><b>${esc(v.name || "Unknown")}</b></dd>
      <dt>MMSI</dt><dd>${v.mmsi}${v.imo ? " · IMO " + v.imo : ""}</dd>
      <dt>Type</dt><dd>${esc(v.ship_type || "–")}</dd>
      <dt>Size</dt><dd>${dims}</dd>
      <dt>Destination</dt><dd>${esc(v.destination || "–")}</dd>
      <dt>Seen</dt><dd>${fmt(v.first_seen)} → ${fmt(v.last_seen)}</dd>`;
    const at = new Date(atValue() + "Z");
    const day = 86400e3;
    const trips = await api("/trips", { mmsi, start: iso(new Date(at - 15 * day)), end: iso(new Date(+at + 15 * day)) });
    setStatus("vessel-status", `${trips.length} trips in the 30 days around the selected time`);
    $("trips").innerHTML = trips.map(t => `
      <li data-trip="${esc(t.trip_id)}">${fmt(t.start_ts)}
      <div class="meta">${(t.distance_m / 1852).toFixed(1)} nm · ${(t.duration_s / 3600).toFixed(1)} h · ${t.point_count} points</div></li>`).join("");
  } catch (e) { setStatus("vessel-status", e.message, true); }
}
window.selectVessel = selectVessel;

function drawLine(latlngs, label) {
  pathLayer.clearLayers();
  if (latlngs.length < 2) { setStatus("vessel-status", "Not enough points to draw", true); return; }
  const line = L.polyline(latlngs, { color: "#e11d48", weight: 3 }).addTo(pathLayer);
  L.circleMarker(latlngs[0], { radius: 5, color: "#15803d", fillOpacity: 1 }).bindTooltip("Start").addTo(pathLayer);
  L.circleMarker(latlngs.at(-1), { radius: 5, color: "#b42318", fillOpacity: 1 }).bindTooltip("End").addTo(pathLayer);
  map.fitBounds(line.getBounds(), { padding: [40, 40], maxZoom: 13 });
  setStatus("vessel-status", label);
}

$("trips").addEventListener("click", async e => {
  const li = e.target.closest("li");
  if (!li) return;
  document.querySelectorAll("#trips li.active").forEach(x => x.classList.remove("active"));
  li.classList.add("active");
  try {
    const g = await api(`/trips/${encodeURIComponent(li.dataset.trip)}/geometry`);
    drawLine(g.geometry.coordinates.map(([lon, lat]) => [lat, lon]), `Trip drawn (${g.geometry.coordinates.length} points)`);
  } catch (err) { setStatus("vessel-status", err.message, true); }
});

$("track-btn").onclick = async () => {
  if (!current) return;
  const at = new Date(atValue() + "Z");
  const half = 12 * 3600e3;
  try {
    const t = await api(`/vessels/${current}/track`, { start: iso(new Date(at - half)), end: iso(new Date(+at + half)) });
    drawLine(t.points.map(p => [p.lat, p.lon]),
      `24 h track: ${t.total_points.toLocaleString()} positions${t.downsampled ? ` (showing ${t.points.length})` : ""}`);
  } catch (e) { setStatus("vessel-status", e.message, true); }
};

$("clear-btn").onclick = () => { pathLayer.clearLayers(); setStatus("vessel-status", ""); };

loadSnapshot();
</script>
</body>
</html>
