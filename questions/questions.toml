# Phase 3 question set: realistic user questions with reference SQL.
#
# Reference answers live in answers.json and are generated against the dev slice
# (2026-09-22..24) with `uv run ais questions`; `uv run pytest -m data` verifies them.
#
# SQL runs on the views from data/ais.duckdb (positions, vessels, vessels_daily, quality,
# trips, stops, trip_geometry, derive_quality) with DuckDB spatial loaded and the
# haversine_m(lat1, lon1, lat2, lon2) macro. Timestamps are UTC. Every multi-row answer
# has a total ORDER BY so answers are deterministic.
#
# Tags: spatial_range, time_window, per_trip, proximity, stops, vessel_lookup, ship_type,
# data_quality.
#
# Optional check_sql: an independent way to compute the same answer; the test asserts they
# agree (these are the hand-checked questions).
#
# Place boxes used below (lon_min, lat_min, lon_max, lat_max):
#   Oresund        12.40, 55.50, 12.95, 56.15
#   Copenhagen     12.53, 55.64, 12.66, 55.73
#   Aarhus         10.20, 56.13, 10.27, 56.17
#   Esbjerg         8.40, 55.44,  8.47, 55.49
#   Frederikshavn  10.52, 57.42, 10.60, 57.45
#   Skagen         10.55, 57.70, 10.65, 57.74
#   Gothenburg     11.60, 57.63, 11.98, 57.73
#   Helsingor      12.60, 56.03, 12.63, 56.05
#   Helsingborg    12.68, 56.03, 12.71, 56.06
#   Kattegat       10.50, 56.00, 12.50, 57.60
#   Great Belt Bridge (line)  10.84 55.310 -> 11.13 55.345

[[question]]
id = "vessels_on_day"
question = "How many different vessels were seen on 23 September?"
paraphrases = [
  "Number of unique ships on Sept 23rd",
  "How many ships were sending AIS on the 23rd?",
]
tags = ["time_window"]
sql = """
SELECT count(DISTINCT mmsi) AS vessels
FROM positions WHERE date = DATE '2026-09-23'
"""
check_sql = """
SELECT count(*) AS vessels FROM (
  SELECT mmsi FROM positions
  WHERE ts >= TIMESTAMP '2026-09-23 00:00:00' AND ts < TIMESTAMP '2026-09-24 00:00:00'
  GROUP BY mmsi
)
"""

[[question]]
id = "vessels_all_days"
question = "How many vessels were seen on all three days?"
tags = ["time_window"]
sql = """
SELECT count(*) AS vessels FROM (
  SELECT mmsi FROM positions GROUP BY mmsi HAVING count(DISTINCT date) = 3
)
"""

[[question]]
id = "most_reports_day"
question = "Which vessel sent the most position reports on 24 September?"
tags = ["time_window", "vessel_lookup"]
sql = """
SELECT p.mmsi, v.name, count(*) AS reports
FROM positions p LEFT JOIN vessels v USING (mmsi)
WHERE p.date = DATE '2026-09-24'
GROUP BY ALL ORDER BY reports DESC, p.mmsi LIMIT 1
"""

[[question]]
id = "oresund_noon"
question = "How many vessels were in the Øresund between 12:00 and 13:00 UTC on 22 September?"
paraphrases = [
  "Count ships in the Sound around noon on the 22nd",
  "How busy was the Øresund from 12 to 13 on Sept 22?",
]
tags = ["spatial_range", "time_window"]
sql = """
SELECT count(DISTINCT mmsi) AS vessels FROM positions
WHERE date = DATE '2026-09-22'
  AND ts >= TIMESTAMP '2026-09-22 12:00:00' AND ts < TIMESTAMP '2026-09-22 13:00:00'
  AND lon BETWEEN 12.40 AND 12.95 AND lat BETWEEN 55.50 AND 56.15
"""

[[question]]
id = "oresund_busiest_hour"
question = "Which hour on 24 September had the most vessels in the Øresund?"
tags = ["spatial_range", "time_window"]
sql = """
SELECT hour(ts) AS hour_utc, count(DISTINCT mmsi) AS vessels FROM positions
WHERE date = DATE '2026-09-24'
  AND lon BETWEEN 12.40 AND 12.95 AND lat BETWEEN 55.50 AND 56.15
GROUP BY 1 ORDER BY vessels DESC, hour_utc LIMIT 1
"""

[[question]]
id = "position_at_time"
question = "Where was TYCHO BRAHE at 12:00 UTC on 23 September?"
paraphrases = [
  "Last known position of the Tycho Brahe ferry at noon on the 23rd",
]
tags = ["vessel_lookup", "time_window"]
sql = """
SELECT p.ts, round(p.lat, 5) AS lat, round(p.lon, 5) AS lon
FROM positions p JOIN vessels v USING (mmsi)
WHERE v.name = 'TYCHO BRAHE' AND p.date = DATE '2026-09-23'
  AND p.ts <= TIMESTAMP '2026-09-23 12:00:00'
ORDER BY p.ts DESC LIMIT 1
"""
check_sql = """
SELECT max(ts) AS ts, round(arg_max(lat, ts), 5) AS lat, round(arg_max(lon, ts), 5) AS lon
FROM positions
WHERE mmsi = (SELECT mmsi FROM vessels WHERE name = 'TYCHO BRAHE')
  AND ts BETWEEN TIMESTAMP '2026-09-23 00:00:00' AND TIMESTAMP '2026-09-23 12:00:00'
"""

[[question]]
id = "crowded_cell"
question = "Which 0.1-degree grid cell had the most vessels between 12:00 and 12:10 UTC on 23 September?"
tags = ["spatial_range", "time_window"]
sql = """
SELECT floor(lat * 10) / 10 AS lat_min, floor(lon * 10) / 10 AS lon_min,
       count(DISTINCT mmsi) AS vessels
FROM positions
WHERE date = DATE '2026-09-23'
  AND ts >= TIMESTAMP '2026-09-23 12:00:00' AND ts < TIMESTAMP '2026-09-23 12:10:00'
GROUP BY 1, 2 ORDER BY vessels DESC, lat_min, lon_min LIMIT 1
"""

[[question]]
id = "fishing_underway"
question = "How many fishing vessels were underway at 06:00 UTC on 24 September?"
paraphrases = ["How many fishing boats were out moving at 6 in the morning on the 24th?"]
tags = ["time_window", "ship_type"]
# Underway = latest report in the 10 minutes before 06:00 has SOG >= 1 kn.
sql = """
SELECT count(*) AS vessels FROM (
  SELECT mmsi, arg_max(sog, ts) AS sog FROM positions
  WHERE date = DATE '2026-09-24'
    AND ts > TIMESTAMP '2026-09-24 05:50:00' AND ts <= TIMESTAMP '2026-09-24 06:00:00'
  GROUP BY mmsi
) JOIN vessels v USING (mmsi)
WHERE v.ship_type = 'Fishing' AND sog >= 1
"""

[[question]]
id = "cargo_speed_kattegat"
question = "What is the average speed of cargo ships underway in the Kattegat?"
tags = ["spatial_range", "ship_type"]
sql = """
SELECT round(avg(p.sog), 2) AS avg_sog_kn
FROM positions p JOIN vessels v USING (mmsi)
WHERE v.ship_type = 'Cargo' AND p.sog >= 1
  AND p.lon BETWEEN 10.50 AND 12.50 AND p.lat BETWEEN 56.00 AND 57.60
"""

[[question]]
id = "near_tycho_brahe"
question = "Which vessels came within 1 km of TYCHO BRAHE between 12:00 and 13:00 UTC on 23 September?"
paraphrases = ["What ships passed close to the Tycho Brahe ferry around midday on the 23rd?"]
tags = ["proximity", "time_window", "vessel_lookup"]
# Positions are aligned to the minute (last report per vessel per minute).
sql = """
WITH m AS (
  SELECT mmsi, date_trunc('minute', ts) AS minute,
         arg_max(lat, ts) AS lat, arg_max(lon, ts) AS lon
  FROM positions
  WHERE date = DATE '2026-09-23'
    AND ts >= TIMESTAMP '2026-09-23 12:00:00' AND ts < TIMESTAMP '2026-09-23 13:00:00'
    AND lon BETWEEN 12.40 AND 12.95 AND lat BETWEEN 55.80 AND 56.20
  GROUP BY 1, 2
), ferry AS (
  SELECT m.* FROM m JOIN vessels v USING (mmsi) WHERE v.name = 'TYCHO BRAHE'
)
SELECT o.mmsi, v.name, round(min(haversine_m(f.lat, f.lon, o.lat, o.lon))) AS closest_m
FROM ferry f JOIN m o ON o.minute = f.minute AND o.mmsi <> f.mmsi
LEFT JOIN vessels v ON v.mmsi = o.mmsi
WHERE haversine_m(f.lat, f.lon, o.lat, o.lon) <= 1000
GROUP BY o.mmsi, v.name ORDER BY closest_m, o.mmsi
"""

[[question]]
id = "closest_pair_oresund"
question = "Which two moving vessels came closest to each other in the Øresund between 12:00 and 12:10 UTC on 24 September?"
tags = ["proximity", "spatial_range", "time_window"]
sql = """
WITH m AS (
  SELECT mmsi, date_trunc('minute', ts) AS minute,
         arg_max(lat, ts) AS lat, arg_max(lon, ts) AS lon, arg_max(sog, ts) AS sog
  FROM positions
  WHERE date = DATE '2026-09-24'
    AND ts >= TIMESTAMP '2026-09-24 12:00:00' AND ts < TIMESTAMP '2026-09-24 12:10:00'
    AND lon BETWEEN 12.40 AND 12.95 AND lat BETWEEN 55.50 AND 56.15
  GROUP BY 1, 2
)
SELECT a.mmsi AS mmsi_a, b.mmsi AS mmsi_b,
       round(min(haversine_m(a.lat, a.lon, b.lat, b.lon))) AS closest_m
FROM m a JOIN m b ON a.minute = b.minute AND a.mmsi < b.mmsi
WHERE a.sog >= 2 AND b.sog >= 2
GROUP BY 1, 2 ORDER BY closest_m, mmsi_a, mmsi_b LIMIT 1
"""

[[question]]
id = "longest_trip_distance"
question = "What was the longest trip by distance, and which ship made it?"
paraphrases = [
  "Which vessel sailed the farthest in a single trip?",
  "Longest voyage in the data, in km",
]
tags = ["per_trip", "vessel_lookup"]
sql = """
SELECT t.trip_id, v.name, round(t.distance_m / 1000, 1) AS km
FROM trips t LEFT JOIN vessels v USING (mmsi)
ORDER BY t.distance_m DESC, t.trip_id LIMIT 1
"""

[[question]]
id = "longest_cargo_trip_time"
question = "Which cargo ship had the longest trip in time?"
tags = ["per_trip", "ship_type"]
sql = """
SELECT v.name, t.trip_id, round(t.duration_s / 3600, 1) AS hours
FROM trips t JOIN vessels v USING (mmsi)
WHERE v.ship_type = 'Cargo'
ORDER BY t.duration_s DESC, t.trip_id LIMIT 1
"""

[[question]]
id = "avg_passenger_trip"
question = "What's the average trip duration for passenger ships, in minutes?"
paraphrases = ["How long does a typical passenger ship trip last on average?"]
tags = ["per_trip", "ship_type"]
sql = """
SELECT round(avg(t.duration_s) / 60, 1) AS avg_minutes, count(*) AS trips
FROM trips t JOIN vessels v USING (mmsi)
WHERE v.ship_type = 'Passenger'
"""

[[question]]
id = "trips_by_type"
question = "Which five ship types made the most trips?"
tags = ["per_trip", "ship_type"]
sql = """
SELECT coalesce(v.ship_type, 'Unknown') AS ship_type, count(*) AS trips
FROM trips t LEFT JOIN vessels v USING (mmsi)
GROUP BY 1 ORDER BY trips DESC, ship_type LIMIT 5
"""

[[question]]
id = "trips_from_copenhagen"
question = "How many trips started in Copenhagen harbour?"
paraphrases = ["Number of departures from the port of Copenhagen"]
tags = ["per_trip", "spatial_range"]
sql = """
SELECT count(*) AS trips FROM trips
WHERE start_lon BETWEEN 12.53 AND 12.66 AND start_lat BETWEEN 55.64 AND 55.73
"""

[[question]]
id = "helsingor_helsingborg"
question = "How many trips went between Helsingør and Helsingborg (either direction)?"
paraphrases = [
  "How many HH-ferry crossings were there?",
  "Count crossings between Helsingør and Helsingborg",
]
tags = ["per_trip", "spatial_range"]
sql = """
WITH t AS (
  SELECT *,
    start_lon BETWEEN 12.60 AND 12.63 AND start_lat BETWEEN 56.03 AND 56.05 AS from_dk,
    start_lon BETWEEN 12.68 AND 12.71 AND start_lat BETWEEN 56.03 AND 56.06 AS from_se,
    end_lon BETWEEN 12.60 AND 12.63 AND end_lat BETWEEN 56.03 AND 56.05 AS to_dk,
    end_lon BETWEEN 12.68 AND 12.71 AND end_lat BETWEEN 56.03 AND 56.06 AS to_se
  FROM trips
)
SELECT count(*) FILTER (WHERE from_dk AND to_se) AS dk_to_se,
       count(*) FILTER (WHERE from_se AND to_dk) AS se_to_dk
FROM t
"""

[[question]]
id = "great_belt_crossings"
question = "How many trips passed under the Great Belt Bridge?"
paraphrases = [
  "How many ships crossed the Storebælt bridge?",
  "Count vessel transits under the Great Belt Bridge",
]
tags = ["per_trip", "spatial_range"]
sql = """
SELECT count(*) AS trips FROM trip_geometry
WHERE ST_Intersects(
  ST_GeomFromGeoJSON(geojson),
  ST_GeomFromText('LINESTRING(10.84 55.310, 11.13 55.345)')
)
"""
# Independent: consecutive raw positions whose connecting segment crosses the bridge,
# mapped to the trip they belong to (a trip can cross more than once).
check_sql = """
WITH p AS (
  SELECT mmsi, ts, lat, lon, lag(lat) OVER w AS plat, lag(lon) OVER w AS plon,
         epoch(ts - lag(ts) OVER w) AS dt
  FROM positions WHERE lon BETWEEN 10.7 AND 11.3 AND lat BETWEEN 55.2 AND 55.45
  WINDOW w AS (PARTITION BY mmsi ORDER BY ts)
)
SELECT count(DISTINCT t.trip_id) AS trips
FROM p JOIN trips t ON t.mmsi = p.mmsi AND p.ts BETWEEN t.start_ts AND t.end_ts
WHERE p.dt < 1800 AND ST_Intersects(
  ST_MakeLine(ST_Point(p.plon, p.plat), ST_Point(p.lon, p.lat)),
  ST_GeomFromText('LINESTRING(10.84 55.310, 11.13 55.345)')
)
"""

[[question]]
id = "passenger_km_day"
question = "How many kilometres did passenger ships sail in total on trips that started on 23 September?"
tags = ["per_trip", "ship_type", "time_window"]
sql = """
SELECT round(sum(t.distance_m) / 1000) AS km
FROM trips t JOIN vessels v USING (mmsi)
WHERE v.ship_type = 'Passenger' AND t.start_ts::DATE = DATE '2026-09-23'
"""

[[question]]
id = "farthest_total"
question = "Which vessel covered the most distance across all its trips?"
paraphrases = ["Which ship sailed the most kilometres in total?"]
tags = ["per_trip", "vessel_lookup"]
sql = """
SELECT t.mmsi, v.name, round(sum(t.distance_m) / 1000) AS km
FROM trips t LEFT JOIN vessels v USING (mmsi)
GROUP BY ALL ORDER BY km DESC, t.mmsi LIMIT 1
"""

[[question]]
id = "first_trip"
question = "When did PRINSESSE BENEDIKTE's first trip on 22 September start and end?"
tags = ["per_trip", "vessel_lookup", "time_window"]
sql = """
SELECT t.start_ts, t.end_ts
FROM trips t JOIN vessels v USING (mmsi)
WHERE v.name = 'PRINSESSE BENEDIKTE' AND t.start_ts::DATE = DATE '2026-09-22'
ORDER BY t.start_ts LIMIT 1
"""

[[question]]
id = "midnight_trips"
question = "How many trips crossed midnight?"
tags = ["per_trip", "time_window"]
sql = """
SELECT count(*) AS trips FROM trips WHERE start_ts::DATE <> end_ts::DATE
"""
check_sql = """
SELECT count(*) AS trips FROM trips
WHERE date_trunc('day', end_ts) > date_trunc('day', start_ts)
"""

[[question]]
id = "fast_trips"
question = "How many trips averaged more than 20 knots?"
paraphrases = ["How many high-speed trips (over 20 kn average) were there?"]
tags = ["per_trip"]
sql = """
SELECT count(*) AS trips FROM trips WHERE distance_m / duration_s * 1.943844 > 20
"""

[[question]]
id = "most_stops"
question = "Which five vessels made the most stops?"
tags = ["stops", "vessel_lookup"]
sql = """
SELECT s.mmsi, v.name, count(*) AS stops
FROM stops s LEFT JOIN vessels v USING (mmsi)
GROUP BY ALL ORDER BY stops DESC, s.mmsi LIMIT 5
"""

[[question]]
id = "longest_stop_aarhus"
question = "What was the longest stop in the port of Aarhus?"
paraphrases = ["Which ship stayed longest in Aarhus harbour?"]
tags = ["stops", "spatial_range"]
sql = """
SELECT s.mmsi, v.name, round(s.duration_s / 3600, 1) AS hours
FROM stops s LEFT JOIN vessels v USING (mmsi)
WHERE s.lon BETWEEN 10.20 AND 10.27 AND s.lat BETWEEN 56.13 AND 56.17
ORDER BY s.duration_s DESC, s.mmsi LIMIT 1
"""

[[question]]
id = "esbjerg_visitors"
question = "How many different vessels stopped in Esbjerg?"
paraphrases = ["Number of distinct ships that called at Esbjerg"]
tags = ["stops", "spatial_range"]
sql = """
SELECT count(DISTINCT mmsi) AS vessels FROM stops
WHERE lon BETWEEN 8.40 AND 8.47 AND lat BETWEEN 55.44 AND 55.49
"""

[[question]]
id = "frederikshavn_and_gothenburg"
question = "Which vessels stopped in both Frederikshavn and Gothenburg?"
tags = ["stops", "spatial_range", "vessel_lookup"]
sql = """
SELECT s.mmsi, v.name FROM stops s LEFT JOIN vessels v USING (mmsi)
GROUP BY ALL
HAVING bool_or(s.lon BETWEEN 10.52 AND 10.60 AND s.lat BETWEEN 57.42 AND 57.45)
   AND bool_or(s.lon BETWEEN 11.60 AND 11.98 AND s.lat BETWEEN 57.63 AND 57.73)
ORDER BY s.mmsi
"""

[[question]]
id = "busiest_port"
question = "Of Copenhagen, Aarhus, Esbjerg, Frederikshavn, Skagen and Gothenburg, which port had the most different vessels stopping?"
paraphrases = ["Rank the main ports by number of visiting ships"]
tags = ["stops", "spatial_range"]
sql = """
WITH ports(port, lon_min, lat_min, lon_max, lat_max) AS (VALUES
  ('Copenhagen', 12.53, 55.64, 12.66, 55.73),
  ('Aarhus', 10.20, 56.13, 10.27, 56.17),
  ('Esbjerg', 8.40, 55.44, 8.47, 55.49),
  ('Frederikshavn', 10.52, 57.42, 10.60, 57.45),
  ('Skagen', 10.55, 57.70, 10.65, 57.74),
  ('Gothenburg', 11.60, 57.63, 11.98, 57.73)
)
SELECT p.port, count(DISTINCT s.mmsi) AS vessels
FROM ports p JOIN stops s
  ON s.lon BETWEEN p.lon_min AND p.lon_max AND s.lat BETWEEN p.lat_min AND p.lat_max
GROUP BY p.port ORDER BY vessels DESC, p.port
"""

[[question]]
id = "hamlet_stopped_hours"
question = "How many hours did HAMLET spend stopped on 24 September?"
tags = ["stops", "vessel_lookup", "time_window"]
# Stops are clipped to the day.
sql = """
SELECT round(sum(epoch(
         least(s.end_ts, TIMESTAMP '2026-09-25 00:00:00')
       - greatest(s.start_ts, TIMESTAMP '2026-09-24 00:00:00'))) / 3600, 2) AS hours
FROM stops s JOIN vessels v USING (mmsi)
WHERE v.name = 'HAMLET'
  AND s.start_ts < TIMESTAMP '2026-09-25 00:00:00'
  AND s.end_ts > TIMESTAMP '2026-09-24 00:00:00'
"""

[[question]]
id = "median_stop_by_type"
question = "What is the median stop duration for each of the five ship types with the most stops?"
tags = ["stops", "ship_type"]
sql = """
SELECT coalesce(v.ship_type, 'Unknown') AS ship_type, count(*) AS stops,
       round(median(s.duration_s) / 60, 1) AS median_minutes
FROM stops s LEFT JOIN vessels v USING (mmsi)
GROUP BY 1 ORDER BY stops DESC, ship_type LIMIT 5
"""

[[question]]
id = "tanker_destinations"
question = "What are the five most common destinations declared by tankers?"
tags = ["vessel_lookup", "ship_type"]
sql = """
SELECT upper(destination) AS destination, count(*) AS tankers
FROM vessels WHERE ship_type = 'Tanker' AND destination IS NOT NULL
GROUP BY 1 ORDER BY tankers DESC, destination LIMIT 5
"""

[[question]]
id = "mega_ships"
question = "Which cargo ships at least 390 m long were seen?"
paraphrases = ["List the biggest container ships in the data"]
tags = ["vessel_lookup", "ship_type"]
sql = """
SELECT mmsi, name, length FROM vessels
WHERE ship_type = 'Cargo' AND length >= 390
ORDER BY length DESC, mmsi
"""

[[question]]
id = "duplicate_share"
question = "What share of the raw AIS rows on 22 September were duplicate receptions?"
tags = ["data_quality"]
sql = """
SELECT round(100.0 * sum(rows_affected) FILTER (WHERE step = 'exact_duplicate')
             / max(rows_in) FILTER (WHERE step_order = 1), 2) AS pct
FROM quality WHERE date = DATE '2026-09-22'
"""
