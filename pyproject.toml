[project]
name = "ais"
version = "0.1.0"
description = "AIS data pipeline and API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
ais = "ais.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: runs against the real dev slice in data/clean (skipped when absent)"]
